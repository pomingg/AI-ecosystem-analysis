[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ecosystem-analysis"
version = "0.1.0"
description = "Cross-dataset analysis bridging arXiv AI/ML research trends with GitHub open-source adoption patterns."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "pyarrow>=12.0",
    "datasets>=3.0,<6",
    "kagglehub>=0.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "ruff>=0.4,<1",
    "jupyter>=1.0",
    "nbstripout>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
